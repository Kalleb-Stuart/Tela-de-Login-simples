<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Autenticação</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>
    <header>
        <h1>Sistema de Autenticação</h1>
    </header>

    <div class="login-container">
        <div class="login-box">
            
            <h1>Login</h1>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" required>
                </div>
                
                <div class="input-group">
                    <label for="senha">Senha:</label>
                    <div style="position: relative; display: flex; align-items: center;">
                        <input type="password" id="senha" placeholder="Digite sua senha" required style="padding-right: 80px;">
                        <button type="button" id="toggleSenha" style="position: absolute; right: 5px; width: auto; padding: 5px 10px; font-size: 0.7rem; background-color: #013A63;">Exibir</button>
                    </div>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="termos">
                    <label for="termos">Li e concordo com os termos de uso</label>
                </div>
                
                <button type="submit" id="btnEntrar">Entrar</button>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
